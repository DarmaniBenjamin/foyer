# Goes inside the <VirtualHost> on the controller server that guests
# arrive at (the one with the line sending /guest/s/ to Foyer, which this
# replaces). Instead of only sending the phone on to Foyer, Apache fetches
# Foyer's answer for it:
#   - Foyer answers: the phone is sent on to Foyer's sign-in page, as before
#   - Foyer doesn't answer within 10 seconds (SiteGround down, or Foyer
#     starting): the phone gets foyer-down.html, a "temporarily
#     unavailable" page that tries again every 15 seconds by itself
# Needs: sudo a2enmod proxy proxy_http ssl headers
SSLProxyEngine on
SSLProxyCheckPeerName on
ProxyPass        /foyer-down.html !
ProxyPass        /guest/s/ https://kyvr3.sg-host.com/guest/s/ connectiontimeout=5 timeout=10
ProxyPass        /omada/   https://kyvr3.sg-host.com/omada/   connectiontimeout=5 timeout=10
ProxyErrorOverride On 502 503 504
ErrorDocument 502 /foyer-down.html
ErrorDocument 503 /foyer-down.html
ErrorDocument 504 /foyer-down.html
Alias /foyer-down.html /var/www/foyer-down/foyer-down.html
<Directory /var/www/foyer-down>
    Require all granted
</Directory>
<Location /foyer-down.html>
    Header always set Cache-Control "no-store"
</Location>
